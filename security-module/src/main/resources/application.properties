# ================================================================
# General Configuration
# ================================================================
quarkus.application.name=security-service
quarkus.http.port=8084

# ================================================================
# Logging
# ================================================================
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c] (%t) %s%e%n
quarkus.log.category."com.mycard.security".level=DEBUG

# Optional file logging
# quarkus.log.file.enable=true
# quarkus.log.file.path=logs/security.log

# ================================================================
# Hibernate ORM & Data Source
# ================================================================
# Automatic database generation (drops and creates schema every time)
quarkus.hibernate-orm.database.generation=drop-and-create

# Database connection settings
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/security_db

# Enable logging of SQL queries for debugging
quarkus.hibernate-orm.log.sql=true

# Database connection pool settings
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=1

# ================================================================
# JWT Configuration (Key Location and Issuer)
# ================================================================
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem

mp.jwt.verify.issuer=https://mycard.io
mp.jwt.verify.aud=client-invite

smallrye.jwt.sign.key.location=META-INF/keys/privateKey.pem

# ================================================================
# OpenAPI & Swagger UI
# ================================================================
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.store-schema-directory=target/META-INF/openapi
quarkus.smallrye-openapi.enable=true

# ================================================================
# REST Client (ACL to client-module)
# ================================================================
client-registration/mp-rest/url=http://localhost:8082

# Invite JWT expiration in hours
mycard.jwt.invite-expiration-hours=24

# Health endpoints
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.ui.enable=true
quarkus.smallrye-health.ui.root-path=/q/health-ui

# ===================================================================
# RabbitMQ / Messaging
# ===================================================================
mp.messaging.outgoing.client-invite-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.client-invite-events.exchange.name=client-invite-events-exchange
mp.messaging.outgoing.client-invite-events.exchange.type=topic
mp.messaging.outgoing.client-invite-events.routing-key=client.invited
mp.messaging.outgoing.client-invite-events.auto-create=true